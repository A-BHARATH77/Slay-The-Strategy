<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      font-family: "Sharp Grotesk", sans-serif;
      /* Remove overflow hidden to allow scrolling */
      overflow-x: hidden;
      position: relative;
      height: 100%;
    }

    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #526855;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
      pointer-events: none;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-imgs {
      width: 100%;
      max-width: 1200px;
      position: relative;
      display: flex;
      gap: 20px;
      padding: 0 20px;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
      justify-content: center;
    }

    .img {
      position: relative;
      flex: 1;
      height: 40vh;
      max-height: 350px;
      aspect-ratio: 1 / 1.2;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    }

    @media (max-width: 768px) {
      .loader-imgs {
        width: 100%;
        gap: 8px;
        padding: 0 10px;
        overflow: hidden;
      }

      .loader-imgs .img:nth-child(1),
      .loader-imgs .img:nth-child(2),
      .loader-imgs .img:nth-child(6),
      .loader-imgs .img:nth-child(7) {
        display: none;
      }

      .img {
        height: 25vh;
        max-height: 200px;
        aspect-ratio: 1 / 1.2;
        min-width: 0;
      }
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Video background */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .website-content {
      position: relative;
      min-height: 100vh;
      width: 100%;
      z-index: 1;
    }

    #logo a {
      text-transform: none;
    }

    a {
      text-decoration: none;
      text-transform: uppercase;
      color: #000;
    }

    .hero {
      width: 100%;
      position: absolute;
      top: 45%;
      transform: translateY(-50%);
      text-transform: uppercase;
      font-family: "Gilda Display", serif;
      font-size: 40px;
      display: flex;
      justify-content: center;
    }

    .hero .h1 {
      width: fit-content;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0) 70%);
      padding: 60px 100px;
    }

    .subheading {
      margin-top: 10px;
      font-size: 18px;
      color: aliceblue;
      font-weight: 400;
    }

    .h1,
    .h3 {
      width: 100%;
      text-align: center;
      color: aliceblue;
      font-size: clamp(2rem, 4vw, 4rem);
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
      padding: 0 15px;
    }

    h1 {
      position: relative;
      font-weight: 400;
      line-height: 85%;
      white-space: nowrap;
    }

    h1 span {
      font-family: "Gilda Display", serif;
      font-weight: 700;
    }

    .text-center {
      text-align: center;
      display: block;
    }

    footer {
      width: 100%;
      position: absolute;
      bottom: 80px; /* Changed from 30px to 80px to move it up */
      right: 0;
      overflow: hidden;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    }

    .marquee-container {
      overflow: hidden;
      width: 100%;
      height: 120px;
      position: relative;
      display: flex;
      align-items: center;
      transform: translateY(-20px); /* Added this to move up by 20px */
    }

    .marquee-track {
      display: flex;
      gap: 20px;
      animation: scroll 20s linear infinite;
      top: 50%;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .item {
      position: relative;
      width: 100px;
      height: 100px;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .item {
        width: 80px;
        height: 80px;
      }

      .marquee-container {
        height: 100px;
      }

      .hero {
        top: 40%;
      }

      .h1, .h3 {
        font-size: clamp(1.2rem, 6vw, 2rem);
      }
      
      h1 {
        white-space: normal;
      }
    }
  </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      gsap.set(".img", { y: 500 });
      gsap.set(".loader-imgs", { x: 500 });
      gsap.set(".nav-item", { y: 25, opacity: 0 });
      gsap.set("h1, .item, footer", { y: 200 });

      const tl = gsap.timeline({ delay: 1 });

      tl.to(".img", {
        y: 0,
        duration: 1.5,
        stagger: 0.05,
        ease: "power3.inOut",
      })
        .to(
          ".loader-imgs",
          {
            x: 0,
            duration: 3,
            ease: "power3.inOut",
          },
          "-=2.5"
        )
        .to(
          ".img:not(#loader-logo)",
          {
            clipPath: "polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)",
            duration: 1,
            stagger: 0.1,
            ease: "power3.inOut",
          },
          "-=1"
        )
        .to(
          ".loader",
          {
            clipPath: "polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)",
            duration: 1,
            ease: "power3.inOut",
          },
          "-=0.5"
        )
        .to(
          ".nav-item, h1, footer, .item",
          {
            y: 0,
            opacity: 1,
            stagger: 0.1,
            duration: 1,
            ease: "power3.inOut",
          },
          "-=0.5"
        );
    });
  </script>
