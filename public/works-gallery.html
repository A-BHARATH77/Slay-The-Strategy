<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Social Moodboard</title>
<style>
:root {
  --color-accent: #526855;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
    
html,
body {
  width: 100%;
  background-color: #f7f2e6;
  overflow-x: hidden;
}

#works-section {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
    
#works-section canvas {
  position: absolute;
  top: 0;
  left: 0;
}
    
nav {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  padding: 2em;
  display: flex;
  justify-content: center;
  z-index: 2;
}
    
nav p {
  text-transform: uppercase;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 4px;
  background-color: #d4f70c;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
    
.header {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  transform-style: preserve-3d;
  perspective: 1000px;
  will-change: transform;
  z-index: 2;
  width: 90%;
}
    
h1 {
  text-transform: uppercase;
  font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
  font-size: 5.5vw;
  letter-spacing: -0.025em;
  line-height: 1;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  color: #526855;
}

h2 {
  font-family: 'Times New Roman', Times, serif;
  color: #526855;
  font-size: clamp(22px, 7vw, 50px);
}

.slide-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.graphics-text {
  color: var(--color-accent);
  text-decoration: none;
  font-family: "Basis Grotesque Pro";
  text-transform: uppercase;
  font-size: 12px;
}

footer {
  width: 100%;

  justify-content: space-between;
  align-items: center;
}

footer p {
  color: var(--color-accent);

  text-transform: uppercase;
  font-size: 12px;
}

.slider {

.slide {

/* ── Mobile overrides ── */
/* Mobile move hint default (hidden on desktop) */
#mobile-move-hint {
  display: none;
  position: absolute;
  bottom: 28px;
  right: 20px;
  z-index: 10;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

#mobile-move-hint.hidden {
  opacity: 0;
}

@media (max-width: 767px) {
  /* On mobile: slider becomes a vertical scroll-snap carousel */
  .slider {
    height: auto;
    min-height: 0;
    perspective: none;
    transform-style: flat;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 20px 16px 40px;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .slide {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    transform: none !important;
    opacity: 1 !important;
    width: min(82vw, 320px);
    height: auto;
    aspect-ratio: 9/16;
    border-radius: 16px;
    scroll-snap-align: center;
    flex-shrink: 0;
    overflow: hidden;
  }

  .slide video,
  .slide .slide-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }

  /* Make the container scroll naturally on mobile */

.hint-pulse-dot {

@keyframes hint-pulse {

  70%  { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); }

.hint-text {

}

@keyframes hint-flicker {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
const isMobile = window.innerWidth < 768;

// ─── Mobile "Move to explore" hint ───────────────────────────────────────────
// The hint element stays visible on mobile as requested by the user
// ─────────────────────────────────────────────────────────────────────────────

// THREE.JS WORKS SCRIPT
const allImages = [
  { url: "/Works Images/1.webp" },
  { url: "/Works Images/aavarna (2).webp" },
  { url: "/Works Images/aavarna stories (1).webp" },
  { url: "/Works Images/aavarna stories.webp" },
  { url: "/Works Images/ginni (1).webp" },
  { url: "/Works Images/ginni (2).webp" },
  { url: "/Works Images/ginni.webp" },
  { url: "/Works Images/Heading (16).webp" },
  { url: "/Works Images/hos (1).webp" },
  { url: "/Works Images/hos (2).webp" },
  { url: "/Works Images/hos (3).webp" },
  { url: "/Works Images/hos (4).webp" },
  { url: "/Works Images/hos (5).webp" },
  { url: "/Works Images/hos (6).webp" },
  { url: "/Works Images/hos.webp" },
  { url: "/Works Images/jsk (1).webp" },
  { url: "/Works Images/jsk (2).webp" },
  { url: "/Works Images/jsk.webp" },
  { url: "/Works Images/Mahru Stories-18.webp" },
  { url: "/Works Images/PLACEMENT FIX.webp" },
  { url: "/Works Images/SAMPLEs  (1).webp" },
  { url: "/Works Images/SAMPLEs  (2).webp" },
  { url: "/Works Images/SAMPLEs .webp" },
  { url: "/Works Images/the sacred nook  (1).webp" },
  { url: "/Works Images/the sacred nook .webp" },
  { url: "/Works Images/_DSC6382.webp" },
  { url: "/Works Images/4 .webp" },
  { url: "/Works Images/Copy of 13.webp" },
  { url: "/Works Images/Copy of 16.webp" },
  { url: "/Works Images/Gray Modern New Release Your Story (2).webp" }
];

const excludedImages = ["/p3.webp"]; 
const images = allImages.filter(img => !excludedImages.includes(img.url));

const uniqueUrls = new Set();
const uniqueImages = images.filter(img => {
  if (uniqueUrls.has(img.url)) {
    return false;
  }
  uniqueUrls.add(img.url);
  return true;
});

// Use fewer grid cells on mobile to reduce GPU load
const params = {
  rows: isMobile ? 4 : 6,
  columns: isMobile ? 4 : 6,
  curvature: 5,
  spacing: 10, 
  imageWidth: 6, 
  imageHeight: 8, 
  depth: 7.5,
  elevation: 0,
  lookAtRange: 20,
  verticalCurvature: 0.5,
  anisotropy: isMobile ? 4 : 16, 
};

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  25,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 0, 40);

const renderer = new THREE.WebGLRenderer({
  antialias: !isMobile,
  powerPreference: "high-performance" 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0xf7f2e6);
renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : window.devicePixelRatio); 
// Append to works-section
document.getElementById('works-section').appendChild(renderer.domElement);

const textureLoader = new THREE.TextureLoader();
const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
params.anisotropy = Math.min(params.anisotropy, maxAnisotropy);

const textureCache = {};
uniqueImages.forEach(image => {
  const texture = textureLoader.load(image.url);
  texture.anisotropy = params.anisotropy;
  texture.minFilter = THREE.LinearMipMapLinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = true;
  textureCache[image.url] = texture;
});

const DEBUG_MODE = false;
let gui;
if (DEBUG_MODE) {
  gui = new dat.GUI();
  gui.add(params, "rows", 1, 10).onChange(updateGallery);
  gui.add(params, "columns", 1, 10).onChange(updateGallery);
  gui.add(params, "imageWidth", 1, 10).onChange(updateGallery);
  gui.add(params, "imageHeight", 1, 10).onChange(updateGallery);
  gui.add(params, "spacing", 2, 20).onChange(updateGallery);
  gui.add(params, "curvature", 0, 10).onChange(updateGallery);
  gui.add(params, "verticalCurvature", 0, 2).onChange(updateGallery);
  gui.add(params, "depth", 5, 50).onChange(updateGallery);
  gui.add(params, "elevation", -10, 10).onChange(updateGallery);
  gui.add(params, "lookAtRange", 5, 50).name("Look Range");
  gui.add(params, "anisotropy", 1, maxAnisotropy).name("Texture Quality").onChange(updateTextureQuality);
}

function updateTextureQuality() {
  Object.values(textureCache).forEach(texture => {
    texture.anisotropy = params.anisotropy;
    texture.needsUpdate = true;
  });
}

const header = document.querySelector(".header");
let headerRotationX = 0;
let headerRotationY = 0;
let headerTranslateZ = 0;

let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;
const lookAtTarget = new THREE.Vector3(0, 0, 0);

function calculateRotations(x, y) {
  const a = 1 / (params.depth * params.curvature);
  const slopeY = -2 * a * x;
  const rotationY = Math.atan(slopeY);

  const verticalFactor = params.verticalCurvature;
  const maxYDistance = (params.rows * params.spacing) / 2;
  const normalizedY = y / maxYDistance;
  const rotationX = normalizedY * verticalFactor;

  return { rotationX, rotationY };
}

function calculatePosition(row, col) {
  let x = (col - params.columns / 2) * params.spacing;
  let y = (row - params.rows / 2) * params.spacing;

  let z = (x * x) / (params.depth * params.curvature);

  const normalizedY = y / ((params.rows * params.spacing) / 2);
  z += Math.abs(normalizedY) * normalizedY * params.verticalCurvature * 5;

  y += params.elevation;

  const { rotationX, rotationY } = calculateRotations(x, y);

  return { x, y, z, rotationX, rotationY };
}

let galleryImages = [];
let usedImageIndices = new Set(); 

function createImagePlane(row, col) {
  let imageIndex;
  do {
    imageIndex = Math.floor(Math.random() * images.length);
  } while (usedImageIndices.has(imageIndex) && usedImageIndices.size < images.length);
  
  usedImageIndices.add(imageIndex);
  
  const imageData = images[imageIndex];
  const geometry = new THREE.PlaneGeometry(
    params.imageWidth,
    params.imageHeight
  );

  const texture = textureCache[imageData.url];
  
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    side: THREE.DoubleSide,
  });

  const plane = new THREE.Mesh(geometry, material);
  const { x, y, z, rotationX, rotationY } = calculatePosition(row, col);

  plane.position.set(x, y, z);
  plane.rotation.x = rotationX;
  plane.rotation.y = rotationY;

  plane.userData.basePosition = { x, y, z };
  plane.userData.baseRotation = { x: rotationX, y: rotationY, z: 0 };
  plane.userData.parallaxFactor = Math.random() * 0.5 + 0.5;
  plane.userData.randomOffset = {
    x: Math.random() * 2 - 1,
    y: Math.random() * 2 - 1,
    z: Math.random() * 2 - 1,
  };
  plane.userData.rotationModifier = {
    x: Math.random() * 0.15 - 0.075,
    y: Math.random() * 0.15 - 0.075,
    z: Math.random() * 0.2 - 0.1,
  };
  plane.userData.phaseOffset = Math.random() * Math.PI * 2;
  
  return plane;
}

function updateGallery() {
  galleryImages.forEach((plane) => {
    scene.remove(plane);
  });

  galleryImages = [];
  
  usedImageIndices = new Set();
  
  const totalImagesNeeded = params.rows * params.columns;
  if (totalImagesNeeded > images.length) {
    const sqrtImages = Math.floor(Math.sqrt(images.length));
    params.rows = sqrtImages;
    params.columns = Math.ceil(images.length / sqrtImages);
  }

  for (let row = 0; row < params.rows; row++) {
    for (let col = 0; col < params.columns; col++) {
      const plane = createImagePlane(row, col);
      galleryImages.push(plane);
      scene.add(plane);
    }
  }
}

// Mouse interaction (desktop)
document.addEventListener("mousemove", (event) => {
  mouseX = (event.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
  mouseY = (event.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

  headerRotationX = -mouseY * 30;
  headerRotationY = mouseX * 30;
  headerTranslateZ = Math.abs(mouseX * mouseY) * 50;
});

// Touch interaction (mobile) - mirrors the mousemove parallax
document.addEventListener("touchmove", (event) => {
  const touch = event.touches[0];
  mouseX = (touch.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
  mouseY = (touch.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

  headerRotationX = -mouseY * 15;
  headerRotationY = mouseX * 15;
  headerTranslateZ = Math.abs(mouseX * mouseY) * 25;
}, { passive: true });

// Device orientation (gyroscope) for the THREE.js scene on mobile
window.addEventListener("deviceorientation", (event) => {
  if (!isMobile) return;
  const gamma = event.gamma || 0; // left-right tilt (-90 to 90)
  const beta  = event.beta  || 0; // front-back tilt
  mouseX = Math.max(-1, Math.min(1, gamma / 30));
  mouseY = Math.max(-1, Math.min(1, (beta - 45) / 30));
}, { passive: true });

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : window.devicePixelRatio);
});

function animate() {
  requestAnimationFrame(animate);

  const targetTransform = `
    translate(-50%, -50%)
    perspective(1000px)
    rotateX(${headerRotationX}deg)
    rotateY(${headerRotationY}deg)
    translateZ(${headerTranslateZ}px)
  `;

  header.style.transform = targetTransform;
  header.style.transition =
    "transform 0.5s cubic-bezier(0.215, 0.61, 0.355, 1)";

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  lookAtTarget.x = targetX * params.lookAtRange;
  lookAtTarget.y = -targetY * params.lookAtRange;
  lookAtTarget.z =
    (lookAtTarget.x * lookAtTarget.x) / (params.depth * params.curvature);

  const time = performance.now() * 0.001;

  galleryImages.forEach((plane) => {
    const {
      basePosition,
      baseRotation,
      parallaxFactor,
      randomOffset,
      rotationModifier,
      phaseOffset,
    } = plane.userData;

    const mouseDistance = Math.sqrt(targetX * targetX + targetY * targetY);
    const parallaxX = targetX * parallaxFactor * 3 * randomOffset.x;
    const parallaxY = targetY * parallaxFactor * 3 * randomOffset.y;
    const oscillation = Math.sin(time + phaseOffset) * mouseDistance * 0.1;

    plane.position.x =
      basePosition.x + parallaxX + oscillation * randomOffset.x;
    plane.position.y =
      basePosition.y + parallaxY + oscillation * randomOffset.y;
    plane.position.z =
      basePosition.z + oscillation * randomOffset.z * parallaxFactor;

    plane.rotation.x =
      baseRotation.x +
      targetY * rotationModifier.x * mouseDistance +
      oscillation * rotationModifier.x * 0.2;

    plane.rotation.y =
      baseRotation.y +
      targetX * rotationModifier.y * mouseDistance +
      oscillation * rotationModifier.y * 0.2;

    plane.rotation.z =
      baseRotation.z +
      targetX * targetY * rotationModifier.z * 2 +
      oscillation * rotationModifier.z * 0.3;
  });

  camera.lookAt(lookAtTarget);
  renderer.render(scene, camera);
}

updateGallery();
animate();

// GSAP SCROLL TRIGGER SCRIPT
gsap.registerPlugin(ScrollTrigger);
window.addEventListener("load", function () {
    // On mobile: slider is a plain flex column — skip GSAP pinning entirely
    if (isMobile) return;

    const slides = gsap.utils.toArray(".slide");

    function getInitialTranslateZ(slide) {
        const style = window.getComputedStyle(slide);
        const matrix = style.transform.match(/matrix3d\((.+)\)/);
        if (matrix) {
            const values = matrix[1].split(", ");
            return parseFloat(values[14]) || 0;
        }
        return 0;
    }

    function mapRange(value, inMin, inMax, outMin, outMax) {
        return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
    }

    const initialZs = slides.map(slide => getInitialTranslateZ(slide));

    ScrollTrigger.create({
        trigger: ".slider",
        start: "top top",
        end: "+=4000",
        scrub: true,
        pin: true,
        onToggle: (self) => {
            if (!self.isActive) {
                slides.forEach((slide) => {
                    const video = slide.querySelector("video");
                    if (video) video.muted = true;
                });
            }
        },
        onUpdate: (self) => {
            const progress = self.progress;
            const zIncrement = progress * 22500;
            
            slides.forEach((slide, index) => {
                const currentZ = initialZs[index] + zIncrement;
                let opacity;

                if (currentZ >= -2500) {
                    opacity = mapRange(currentZ, -2500, 0, 0.5, 1);
                } else {
                    opacity = mapRange(currentZ, -5000, -2500, 0, 0.5);
                }

                slide.style.opacity = opacity;
                slide.style.transform = `translateX(-50%) translateY(-50%) translateZ(${currentZ}px)`;

                const video = slide.querySelector("video");
                if (video) {
                    if (self.isActive && currentZ >= -1250 && currentZ <= 1250) {
                        if (video.muted) video.muted = false;
                    } else {
                        if (!video.muted) video.muted = true;
                    }
                }
            });
        },
    });
});

// INTERSECTION OBSERVER FOR MOBILE (or fallback) TO UNMUTE VIDEOS IN VIEW
const videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
            video.muted = false;
        } else {
            video.muted = true;
        }
    });
}, { threshold: 0.5 }); // Unmute when at least 50% visible

document.querySelectorAll('.slide video').forEach(video => {
    videoObserver.observe(video);
});
</script>
</body>
